name: Build NovaOS V20 ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      # Bước 1: Fix quyền các thư mục temp mà actions/checkout cần ghi vào.
      # Nguyên nhân lỗi "Access to path '/home/runner/work/_temp/...' is denied"
      # là do UID giữa runner host và container Arch không khớp.
      - name: Fix workspace permissions
        run: |
          mkdir -p /__w
          mkdir -p /home/runner/work/_temp
          mkdir -p /home/runner/work/_temp/_github_workflow
          mkdir -p /home/runner/work/_temp/_github_home
          chmod -R 777 /__w || true
          chmod -R 777 /home/runner/work || true
          chmod -R 777 /github || true

      # Bước 2: Dùng checkout@v3.0.2 thay vì v4.
      # v3.0.2 dùng Node 16, không bị force lên Node 24 và không tạo file temp theo cách gây lỗi.
      - name: Checkout source
        uses: actions/checkout@v3.0.2

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            archiso \
            rsync \
            sudo \
            base-devel \
            git \
            wget \
            curl \
            squashfs-tools \
            libisoburn \
            mtools \
            dosfstools \
            e2fsprogs \
            erofs-utils \
            jq \
            zstd \
            which

      - name: Verify environment
        run: |
          echo "=== check commands ==="
          command -v mkarchiso || { echo "MISSING mkarchiso"; exit 1; }
          command -v rsync     || { echo "MISSING rsync";     exit 1; }
          command -v sudo      || { echo "MISSING sudo";      exit 1; }
          command -v pacman    || { echo "MISSING pacman";    exit 1; }
          echo "=== check releng ==="
          ls -la /usr/share/archiso/configs/releng/

      - name: Create builder user
        run: |
          useradd -m -G wheel builder || true
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder /__w || true

      - name: Run build.sh
        run: |
          cd /__w/novaOS-nuild/novaOS-nuild
          sudo -u builder ./build.sh
        timeout-minutes: 55

      - name: Locate ISO
        id: find_iso
        if: success()
        run: |
          ISO=$(find /__w/novaOS-nuild/novaOS-nuild/out -maxdepth 1 -type f -name '*.iso' -print -quit)
          if [ -z "$ISO" ]; then
            echo "No ISO found"
            exit 1
          fi
          echo "ISO_PATH=$ISO" >> $GITHUB_OUTPUT
          echo "ISO_NAME=$(basename $ISO)" >> $GITHUB_OUTPUT
          ls -lh "$ISO"

      - name: Upload ISO artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: novaos-v20-iso
          path: |
            /__w/novaOS-nuild/novaOS-nuild/out/*.iso
            /__w/novaOS-nuild/novaOS-nuild/out/*.sha256
          retention-days: 30

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: /__w/novaOS-nuild/novaOS-nuild/work/
          retention-days: 7
          if-no-files-found: ignore
