name: Build NovaOS V20 ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Fix workspace permissions
        run: |
          mkdir -p /__w
          mkdir -p /home/runner/work/_temp
          mkdir -p /home/runner/work/_temp/_github_workflow
          mkdir -p /home/runner/work/_temp/_github_home
          chmod -R 777 /__w || true
          chmod -R 777 /home/runner/work || true
          chmod -R 777 /github || true

      - name: Checkout source
        uses: actions/checkout@v3.0.2

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            archiso \
            rsync \
            sudo \
            base-devel \
            git \
            wget \
            curl \
            squashfs-tools \
            libisoburn \
            mtools \
            dosfstools \
            e2fsprogs \
            erofs-utils \
            jq \
            zstd \
            which

      - name: Verify environment
        run: |
          command -v mkarchiso || { echo "MISSING mkarchiso"; exit 1; }
          command -v rsync     || { echo "MISSING rsync";     exit 1; }
          command -v sudo      || { echo "MISSING sudo";      exit 1; }
          command -v pacman    || { echo "MISSING pacman";    exit 1; }
          ls -la /usr/share/archiso/configs/releng/

      - name: Create builder user
        run: |
          useradd -m -G wheel builder || true
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder /__w || true

      # Fix pacstrap file conflicts: NovaOS ships 4 files under airootfs/
      # that Arch packages also provide. Move them to a staging dir inside
      # airootfs/root/, then customize_airootfs.sh (which runs AFTER pacstrap)
      # copies them to their real location. Source on GitHub is unchanged.
      - name: Stage conflicting airootfs files
        run: |
          set -x
          cd /__w/novaOS-nuild/novaOS-nuild
          STAGE=airootfs/root/novaos-xdg-stage
          mkdir -p "$STAGE"

          for rel in \
            "etc/xdg/autostart/nm-applet.desktop" \
            "etc/xdg/xfce4/xfconf/xfce-perchannel-xml/xfce4-keyboard-shortcuts.xml" \
            "etc/xdg/xfce4/xfconf/xfce-perchannel-xml/xsettings.xml" \
            "etc/xdg/Thunar/uca.xml"; do
            if [ -f "airootfs/$rel" ]; then
              mkdir -p "$STAGE/$(dirname "$rel")"
              mv "airootfs/$rel" "$STAGE/$rel"
              echo "Staged: $rel"
            fi
          done

          # Append restore hook to customize_airootfs.sh
          # This script runs inside the chroot AFTER pacstrap completes.
          cat >> airootfs/root/customize_airootfs.sh <<'RESTORE_EOF'

          # --- NovaOS build helper: restore xdg files staged before pacstrap ---
          if [ -d /root/novaos-xdg-stage ]; then
            cd /root/novaos-xdg-stage
            find . -type f -print0 | while IFS= read -r -d '' f; do
              mkdir -p "/$(dirname "$f")"
              cp -a "$f" "/$f"
            done
            cd /
            rm -rf /root/novaos-xdg-stage
          fi
          RESTORE_EOF

          echo "=== staged files ==="
          find "$STAGE" -type f
          echo "=== tail of customize_airootfs.sh ==="
          tail -20 airootfs/root/customize_airootfs.sh

          chown -R builder:builder /__w || true

      - name: Run build.sh
        run: |
          set -x
          BUILD_DIR=/__w/novaOS-nuild/novaOS-nuild
          chmod +x "$BUILD_DIR/build.sh"
          cd "$BUILD_DIR"
          sudo -u builder bash "$BUILD_DIR/build.sh"
        timeout-minutes: 55

      - name: Locate ISO
        id: find_iso
        if: success()
        run: |
          ISO=$(find /__w/novaOS-nuild/novaOS-nuild/out -maxdepth 1 -type f -name '*.iso' -print -quit)
          if [ -z "$ISO" ]; then
            echo "No ISO found"
            exit 1
          fi
          echo "ISO_PATH=$ISO" >> $GITHUB_OUTPUT
          echo "ISO_NAME=$(basename $ISO)" >> $GITHUB_OUTPUT
          ls -lh "$ISO"

      - name: Upload ISO artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: novaos-v20-iso
          path: |
            /__w/novaOS-nuild/novaOS-nuild/out/*.iso
            /__w/novaOS-nuild/novaOS-nuild/out/*.sha256
          retention-days: 30

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: /__w/novaOS-nuild/novaOS-nuild/work/
          retention-days: 7
          if-no-files-found: ignore
